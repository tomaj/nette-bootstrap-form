<form action="" method="post" class="form-inline" novalidate="novalidate">


<div class="form-group">
	<label for="frm-name">Name</label>

	<input type="text" name="name" placeholder="Your name" class="form-control text" id="frm-name" value='John <Doe> &amp; "Co"'>
</div>

<div class="form-group">
	<label for="frm-password">Password</label>

	<input type="password" name="password" class="form-control text" id="frm-password">
</div>

<div class="form-group">
	<label for="frm-email">E-mail</label>

	<input type="email" name="email" class="form-control" id="frm-email" data-nette-rules='[{"op":":email","msg":"Please enter a valid email address."}]'>
</div>

<div class="form-group">
	<label for="frm-age">Age</label>

	<input type="number" name="age" class="form-control" id="frm-age" data-nette-rules='[{"op":":integer","msg":"Please enter a valid integer."}]'>
</div>

<div class="form-group">
	<label for="frm-nolabel"></label>

	<input type="text" name="nolabel" class="form-control text" id="frm-nolabel">
</div>

<div class="form-group">
	<label for="frm-described">Described</label>

	<input type="text" name="described" class="form-control text" id="frm-described"> <span class="help-block">Some help text</span>
</div>

<div class="form-group">
	<label for="frm-html_described">HTML described</label>

	<input type="text" name="html_described" class="form-control text" id="frm-html_described"> Help with <code>code</code>
</div>

<div class="form-group">
	<label for="frm-disabled">Disabled</label>

	<input type="text" name="disabled" class="form-control text" id="frm-disabled" disabled>
</div>


</form>
