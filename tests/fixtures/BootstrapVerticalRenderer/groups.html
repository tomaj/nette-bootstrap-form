<form action="" method="post" novalidate="novalidate">

<fieldset>
<legend>Personal</legend>


<div class="form-group">
	<label for="frm-name">Name</label>

	<input type="text" name="name" class="form-control text" id="frm-name">
</div>

</fieldset>

<fieldset>
<legend>Address</legend>
<p>Where you live</p>


<div class="form-group">
	<label for="frm-street">Street</label>

	<input type="text" name="street" class="form-control text" id="frm-street">
</div>

<div class="form-group">
	

	<div class="checkbox"><label for="frm-primary"><input type="checkbox" name="primary" id="frm-primary">Primary address</label></div>
</div>

</fieldset>


<div class="form-group">
	

	<input type="submit" name="send" class="btn btn-primary button" value="Send">
</div>


</form>
