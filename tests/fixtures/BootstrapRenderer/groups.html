<form action="" method="post" class="form-horizontal" novalidate="novalidate">

<fieldset>
<legend>Personal</legend>

<div>
<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-name">Name</label></div>

	<div class="col-sm-9"><input type="text" name="name" class="form-control text" id="frm-name"></div>
</div>
</div>
</fieldset>

<fieldset>
<legend>Address</legend>
<p>Where you live</p>

<div>
<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-street">Street</label></div>

	<div class="col-sm-9"><input type="text" name="street" class="form-control text" id="frm-street"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"></div>

	<div class="col-sm-9"><div class="checkbox"><label for="frm-primary"><input type="checkbox" name="primary" id="frm-primary">Primary address</label></div></div>
</div>
</div>
</fieldset>

<div>
<div class="form-group">
	<div class="col-sm-3 control-label"></div>

	<div class="col-sm-9"><input type="submit" name="send" class="btn btn-primary button" value="Send"></div>
</div>
</div>

</form>
