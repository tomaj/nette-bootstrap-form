<form action="" method="post" class="form-horizontal" novalidate="novalidate">

<div class="alert alert-danger">
	<p>
		<strong>HTML error</strong>
	</p>

	<p>Form error &lt;b&gt;escaped&lt;/b&gt;.</p>
</div>


<div>
<div class="form-group has-error">
	<div class="col-sm-3 control-label"><label for="frm-name">Name</label></div>

	<div class="col-sm-9"><input type="text" name="name" class="form-control text" id="frm-name">
	<span class="help-block">Name is wrong.</span></div>
</div>

<div class="form-group has-error">
	<div class="col-sm-3 control-label"></div>

	<div class="col-sm-9"><div class="checkbox"><label for="frm-terms"><input type="checkbox" name="terms" id="frm-terms">Terms</label></div>
	<span class="help-block">Terms are wrong.</span></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-ok">OK</label></div>

	<div class="col-sm-9"><input type="text" name="ok" class="form-control text" id="frm-ok"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"></div>

	<div class="col-sm-9"><input type="submit" name="send" class="btn btn-primary button" value="Send"></div>
</div>
</div>

</form>
