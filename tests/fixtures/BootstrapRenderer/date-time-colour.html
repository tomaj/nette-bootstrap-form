<form action="" method="post" class="form-horizontal" novalidate="novalidate">

<div>
<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-day">Day</label></div>

	<div class="col-sm-9"><input type="date" name="day" class="form-control" id="frm-day" value="2026-11-26"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-time">Time</label></div>

	<div class="col-sm-9"><input type="time" name="time" class="form-control" id="frm-time"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-meeting">Meeting</label></div>

	<div class="col-sm-9"><input type="datetime-local" name="meeting" class="form-control" id="frm-meeting"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-styled">Styled</label></div>

	<div class="col-sm-9"><input type="date" name="styled" class="form-control" id="frm-styled"></div>
</div>

<div class="form-group">
	<div class="col-sm-3 control-label"><label for="frm-colour">Colour</label></div>

	<div class="col-sm-9"><input type="color" name="colour" id="frm-colour" value="#7952b3"></div>
</div>
</div>

</form>
