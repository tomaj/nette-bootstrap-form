name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PHP 8.7 is a nightly build: it runs to show problems early but does not fail the workflow
    continue-on-error: ${{ matrix.php == '8.7' }}
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6', '8.7']
        dependency-version: ['']
        include:
          - php: '8.4'
            dependency-version: '--prefer-lowest'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, xml
        coverage: ${{ matrix.php == '8.6' && matrix.dependency-version == '' && 'xdebug' || 'none' }}

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-

    - name: Install dependencies
      # dependencies cap their PHP version, so the nightly ignores the upper bound
      run: composer update ${{ matrix.dependency-version }} ${{ matrix.php == '8.7' && '--ignore-platform-req=php+' || '' }} --prefer-dist --no-progress --no-interaction

    - name: Run tests
      if: matrix.php != '8.6' || matrix.dependency-version != ''
      run: vendor/bin/phpunit --no-coverage

    - name: Run tests with coverage
      if: matrix.php == '8.6' && matrix.dependency-version == ''
      run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-html build/coverage

    - name: Require 95% statement coverage
      if: matrix.php == '8.6' && matrix.dependency-version == ''
      run: |
        php -r '
          $xml = simplexml_load_file("build/logs/clover.xml");
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          $percent = $statements === 0 ? 0 : ($covered / $statements) * 100;
          echo sprintf("Statements: %d/%d (%.2f%%)\n", $covered, $statements, $percent);
          if ($percent < 95) {
              fwrite(STDERR, "Statement coverage is below 95%.\n");
              exit(1);
          }
        '

    - name: Upload coverage to Coveralls
      if: matrix.php == '8.6' && matrix.dependency-version == ''
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: build/logs/clover.xml
        format: clover
        fail-on-error: false

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.6' && matrix.dependency-version == ''
      with:
        name: coverage-report
        path: build/coverage

  code-style:
    name: Code Style (PER-CS/PSR-12 + PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Check code style
      run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

  static-analysis:
    name: Static Analysis (PHPStan level max)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --memory-limit=1G

  rector:
    name: Rector
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run Rector
      run: vendor/bin/rector --dry-run --no-progress-bar

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run security audit
      run: composer audit
