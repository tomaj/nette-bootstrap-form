name: Bug report
description: Report a defect or unexpected output of nette-bootstrap-form
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a security vulnerability, do not continue. Report it privately at https://github.com/tomaj/nette-bootstrap-form/security/advisories/new (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: The checkbox label is rendered outside the form-group when...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Form definition
      description: The smallest form that shows the problem, and which renderer you use.
      render: php
      placeholder: |
        $form = new Nette\Forms\Form();
        $form->addCheckbox('agree', 'I agree');
        $form->setRenderer(new Tomaj\Form\Renderer\BootstrapRenderer());
        echo $form;
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected HTML
      description: What markup did you expect?
      render: html
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual HTML
      description: What was rendered instead? Include the exception message if there is one.
      render: html
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - BootstrapRenderer (horizontal)
        - BootstrapVerticalRenderer
        - BootstrapInlineRenderer
        - All of them
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nette-bootstrap-form version
      description: The version from composer, for example 2.1.1.
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: nette-forms-version
    attributes:
      label: nette/forms version
      placeholder: "3.2.8"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`.
      placeholder: "8.4"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Bootstrap version, screenshots, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
